<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poké Wars</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/ui.css" />
    <link rel="stylesheet" href="/src/hud.css" />
  </head>
  <body>
    <main>
      <div id="stage">
        <canvas id="map"></canvas>
        <canvas id="mapfx"></canvas>
        <div id="hud">
          <div id="cos"></div>
          <div id="clock"></div>
          <div id="mini">
            <canvas id="minimap" title="Minimapa: haz clic para mover la cámara"></canvas>
            <div class="sys">
              <button id="ai"></button><button id="fog">Niebla: sí</button><button id="mute"></button><button id="new">Nueva partida</button>
            </div>
          </div>
          <div id="dock">
            <div id="info"></div>
            <div class="cmd"><button id="power"></button><button id="end"></button></div>
          </div>
        </div>
        <div id="menu" class="box" hidden></div>
        <div id="forecast" class="box" hidden></div>
        <div id="recruit" class="box" hidden></div>
        <div id="scene" hidden>
          <canvas></canvas>
          <div class="plate left"><img alt=""><div><b class="name"></b><span class="type"></span>
            <div class="hp"><u></u><i></i></div></div><small class="hpnum"></small></div>
          <div class="plate right"><img alt=""><div><b class="name"></b><span class="type"></span>
            <div class="hp"><u></u><i></i></div></div><small class="hpnum"></small></div>
          <div class="counter"></div>
          <div class="msg box"></div>
        </div>
        <div id="talk" hidden></div>
        <div id="banner" hidden></div>
        <div id="cutin" hidden></div>
        <div id="select" hidden></div>
        <div id="overlay" hidden></div>
        <div id="wipe" hidden></div>
      </div>
      
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

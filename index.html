<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poké Wars</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/ui.css" />
    <link rel="stylesheet" href="/src/hud.css" />
    <link rel="preload" as="font" type="font/woff2" href="fonts/jersey25.woff2" crossorigin />
    <!-- Pantalla de carga: va en línea para que se vea antes de que llegue nada más. Toda la pantalla es una Poké Ball
         que se menea; el botón del centro marca el progreso y, al acabar, se abre por la mitad y descubre el título. -->
    <style>
      @font-face { font-family: 'Jersey 25'; src: url(fonts/jersey25.woff2) format('woff2'); font-display: swap; }
      #loading { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #10141c; font-family: 'Jersey 25', system-ui, sans-serif; color: #fff; line-height: 1; user-select: none; }
      #loading[hidden] { display: none; }
      .ld-ball { position: absolute; inset: -9%; animation: ld-shake 2.2s cubic-bezier(0.3, 0, 0.3, 1) infinite; }
      @keyframes ld-shake { 0%, 52%, 100% { transform: rotate(0); } 60% { transform: rotate(-2.2deg); } 70% { transform: rotate(2.2deg); } 80% { transform: rotate(-1.4deg); } 90% { transform: rotate(0.8deg); } }
      .ld-half { position: absolute; left: 0; right: 0; height: 50%; display: grid; place-items: center; transition: transform 0.75s cubic-bezier(0.7, -0.25, 0.3, 1); }
      .ld-half::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, #ffffff14 0 5vh, transparent 5vh 12vh); background-size: 26.5vh 100%; animation: ld-slide 1.4s linear infinite; }
      @keyframes ld-slide { to { background-position-x: 26.5vh; } }
      .ld-top { top: 0; background: radial-gradient(ellipse 70% 120% at 28% 0, #ff7a6c, #e8483c 45%, #b8281c); border-bottom: 3.6vh solid #10141c; }
      .ld-bot { bottom: 0; background: radial-gradient(ellipse 70% 120% at 72% 100%, #ffffff, #e6eaf2 45%, #b4bccc); border-top: 3.6vh solid #10141c; color: #10141c; }
      .ld-logo { position: relative; margin-bottom: 9vh; text-align: center; filter: drop-shadow(0 1vh 0 #7c140c); }
      .ld-logo span { display: block; font-size: 17vh; letter-spacing: 0.04em; color: #ffcb05; text-shadow: 0.035em 0 #2a5caa, -0.035em 0 #2a5caa, 0 0.035em #2a5caa, 0 -0.035em #2a5caa, 0.03em 0.03em #2a5caa, -0.03em -0.03em #2a5caa, 0.03em -0.03em #2a5caa, -0.03em 0.03em #2a5caa, 0.06em 0.07em #1b3f7a; }
      .ld-logo b { display: block; margin-top: -3vh; font-weight: 400; font-size: 12vh; letter-spacing: 0.24em; margin-left: 0.24em; transform: skewX(-10deg); text-shadow: 0.05em 0.06em 0 #7c140c; }
      .ld-info { position: relative; margin-top: 13vh; text-align: center; max-width: 80vw; }
      .ld-info small { display: block; font-size: 3vh; letter-spacing: 0.3em; color: #5c6884; }
      .ld-tip { margin: 1.2vh 0 0; min-height: 4.4vh; font-size: 4.2vh; animation: ld-tip 2.6s both; }
      @keyframes ld-tip { 0% { opacity: 0; transform: translateY(1.4vh); } 12%, 88% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-1.4vh); } }
      .ld-btn { position: absolute; left: 50%; top: 50%; width: 30vh; height: 30vh; margin: -15vh; border-radius: 50%; background: #10141c; display: grid; place-items: center; box-shadow: 0 1.4vh 0 #0c101880; animation: ld-pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) backwards; }
      @keyframes ld-pop { from { transform: scale(0); } }
      .ld-btn i { width: 23vh; height: 23vh; border-radius: 50%; background: conic-gradient(#ffcb05 calc(var(--p, 0) * 1%), #f4f6fa 0); display: grid; place-items: center; }
      .ld-btn i::after { content: ''; width: 17.5vh; height: 17.5vh; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #dfe4ee 60%, #aab4c8); box-shadow: 0 0 0 1vh #10141c; animation: ld-glow 1.1s steps(2) infinite; }
      @keyframes ld-glow { 50% { background: radial-gradient(circle at 35% 30%, #fff, #fff2c0 60%, #f0c850); } }
      .ld-btn b { position: absolute; font-weight: 400; font-size: 8vh; color: #10141c; }
      .ld-btn b::after { content: '%'; font-size: 0.5em; }
      /* Cargado: el botón destella y la Ball se abre por la mitad */
      #loading.done { background: none; pointer-events: none; }
      #loading.done .ld-ball { animation: none; }
      #loading.done .ld-top { transform: translateY(-112%); }
      #loading.done .ld-bot { transform: translateY(112%); }
      #loading.done .ld-btn { animation: ld-open 0.6s forwards; }
      @keyframes ld-open { 0% { transform: scale(1); } 25% { transform: scale(1.25); background: #fff; filter: brightness(3); } 100% { transform: scale(0); opacity: 0; } }
      #loading.done::after { content: ''; position: absolute; inset: 0; background: #fff; animation: ld-flash 0.5s forwards; }
      @keyframes ld-flash { from { opacity: 0.9; } to { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="ld-ball">
        <div class="ld-half ld-top"><div class="ld-logo"><span>POKÉ</span><b>WARS</b></div></div>
        <div class="ld-half ld-bot"><div class="ld-info"><small>CARGANDO</small><p class="ld-tip">Preparando el campo de batalla…</p></div></div>
      </div>
      <div class="ld-btn"><i></i><b>0</b></div>
    </div>
    <main>
      <div id="stage">
        <canvas id="map"></canvas>
        <canvas id="mapfx"></canvas>
        <div id="hud">
          <div id="cos"></div>
          <div id="clock"></div>
          <div id="mini">
            <canvas id="minimap" title="Minimapa: haz clic para mover la cámara"></canvas>
            <div class="sys">
              <button id="ai"></button><button id="fog">Niebla: sí</button><button id="mute"></button><button id="helpbtn">Ayuda (H)</button><button id="new">Salir al título</button>
            </div>
          </div>
          <div id="hints" hidden></div>
          <div id="dock">
            <div id="info"></div>
            <div class="cmd"><button id="power"></button><button id="end"></button></div>
          </div>
        </div>
        <div id="menu" class="box" hidden></div>
        <div id="forecast" class="box" hidden></div>
        <div id="recruit" class="box" hidden></div>
        <div id="scene" hidden>
          <canvas></canvas>
          <div class="plate left"><img alt=""><div><b class="name"></b><span class="type"></span>
            <div class="hp"><u></u><i></i></div></div><small class="hpnum"></small></div>
          <div class="plate right"><img alt=""><div><b class="name"></b><span class="type"></span>
            <div class="hp"><u></u><i></i></div></div><small class="hpnum"></small></div>
          <div class="counter"></div>
          <div class="msg box"></div>
        </div>
        <div id="talk" hidden></div>
        <div id="banner" hidden></div>
        <div id="cutin" hidden></div>
        <div id="title" hidden>
          <div class="beams"></div>
          <div class="duel">
            <div class="rival t0"><div class="pic"><img class="e1" alt=""><img class="main" alt=""></div><div class="who"><b></b><span></span></div><p class="say"></p></div>
            <div class="rival t1"><div class="pic"><img class="e1" alt=""><img class="main" alt=""></div><div class="who"><b></b><span></span></div><p class="say"></p></div>
          </div>
          <div class="logo2"><div class="poke"></div><div class="wars"></div></div>
          <div class="tag">Estrategia por turnos · Captura, evoluciona y conquista</div>
          <div class="press">Pulsa cualquier tecla</div>
          <div class="menu">
            <button data-go="continue" hidden><b>CONTINUAR</b><small>Sigue la partida guardada</small></button>
            <button data-go="solo"><b>NUEVA PARTIDA</b><small>Tú contra la IA</small></button>
            <button data-go="duo"><b>DOS JUGADORES</b><small>En este ordenador, por turnos</small></button>
            <div class="maps"></div>
            <div class="blurb"></div>
          </div>
          <div class="toggles"><button data-opt="help">? Cómo se juega</button><button data-opt="fog"></button><button data-opt="sound"></button></div>
          <div class="foot"><span><kbd>←↑↓→</kbd> moverse · <kbd>Enter</kbd> aceptar · <kbd>1</kbd>–<kbd>3</kbd> mapa · <kbd>N</kbd> niebla · <kbd>M</kbd> sonido · <kbd>H</kbd> ayuda</span><span>Juego de fans sin ánimo de lucro · hecho con Claude Opus 5.5</span></div>
        </div>
        <div id="select" hidden></div>
        <div id="overlay" hidden></div>
        <div id="wipe" hidden></div>
      </div>
      <div id="help" hidden></div>
      
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
